name: CI

on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
        exclude:
          - os: macos-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Show interpreter
        run: python --version
      - name: Unit tests (stdlib only, no pip install)
        run: python run_tests.py -v
      - name: Self test (build → diff → check → apply → revert)
        run: python -m surreal selftest
      - name: CLI smoke
        run: |
          python -m surreal --help
          python -m surreal demo --out demo-out
          python -m surreal inspect demo-out/demo_app.exe --json
          python -m surreal check demo-out/demo-shorten-nag.morph --target demo-out/demo_app.exe
      - name: Signing smoke (M1)
        run: |
          python -m surreal keys --generate demo-out/ci.key --label ci
          python -m surreal sign demo-out/demo-shorten-nag.morph --key demo-out/ci.key --signer ci
          python -m surreal verify demo-out/demo-shorten-nag.morph
          python -c "import json;print(json.load(open('demo-out/ci.key'))['public_key'])" > pub.txt
          python -m surreal keys --trust "$(cat pub.txt)" --label ci
          python -m surreal verify demo-out/demo-shorten-nag.morph --require
          python -m surreal init --accept-policy
          python -m surreal apply demo-out/demo-shorten-nag.morph --target demo-out/demo_app.exe -y --require-signature
          python -m surreal revert demo-out/demo_app.exe
      - name: Collection smoke (M3)
        run: |
          python -m surreal collection list examples
          python -m surreal collection check examples --target demo-out/demo_app.exe
          python -m surreal collection apply examples --target demo-out/demo_app.exe -y
          python -m surreal revert demo-out/demo_app.exe
      - name: Size-changing (overlay) smoke
        run: |
          python -m surreal apply examples/demo-append-overlay.morph --target demo-out/demo_app.exe -y
          python -m surreal revert demo-out/demo_app.exe
      - name: Header surgery (M2+) smoke
        run: |
          python -m surreal check examples/demo-extend-section.morph --target demo-out/demo_app.exe
          python -m surreal apply examples/demo-extend-section.morph --target demo-out/demo_app.exe -y
          python -m surreal inspect demo-out/demo_app.exe --json > after.json
          python -m surreal revert demo-out/demo_app.exe
      - name: Vault smoke (multi-file, M3)
        run: |
          python - <<'EOF'
          import json, os, shutil, sys
          sys.path.insert(0, ".")
          from surreal.testkit import build_pe
          from surreal.diffgen import build_bundle

          os.makedirs("vault-out/app", exist_ok=True)
          os.makedirs("vault-out/vault", exist_ok=True)
          shutil.copyfile("demo-out/demo_app.exe", "vault-out/app/main.exe")
          helper = build_pe([(".text", b"\x90" * 0x100, 0x60000020),
                             (".rdata", b"helper-strings\0" * 8, 0x40000040)])
          with open("vault-out/app/helper.dll", "wb") as fh:
              fh.write(helper)
          shutil.copyfile("demo-out/demo-shorten-nag.morph",
                          "vault-out/vault/main.morph")
          fixed = bytearray(helper)
          at = bytes(fixed).find(b"helper-strings")
          fixed[at:at + 14] = b"VAULT-STRINGS!"
          with open("vault-out/helper_fixed.dll", "wb") as fh:
              fh.write(bytes(fixed))
          bundle, _ = build_bundle("vault-out/app/helper.dll",
                                   "vault-out/helper_fixed.dll",
                                   "org.ci.vault-helper", "helper")
          bundle.save("vault-out/vault/helper.morph")
          with open("vault-out/vault/surreal-collection.json", "w") as fh:
              json.dump({"format": "surreal.collection", "format_version": 1,
                         "name": "ci vault",
                         "patches": [
                             {"bundle": "main.morph", "target": "main.exe", "order": 10},
                             {"bundle": "helper.morph", "target": "helper.dll",
                              "order": 20}]}, fh, indent=2)
          EOF
          python -m surreal collection list vault-out/vault
          python -m surreal collection check vault-out/vault --target vault-out/app
          python -m surreal init --accept-policy
          python -m surreal collection apply vault-out/vault --target vault-out/app -y
          python -m surreal revert vault-out/app/main.exe
          python -m surreal revert vault-out/app/helper.dll
      - name: Local repo smoke (M4)
        run: |
          python -m surreal repo index examples -o examples/surreal-repo.json --created 2026-11-01T00:00:00Z
          python -m surreal repo list examples/surreal-repo.json --target demo-out/demo_app.exe
          python -m surreal repo show examples/surreal-repo.json --id org.surreal.demo.shorten-nag
          python -m surreal repo apply examples/surreal-repo.json --id org.surreal.demo.shorten-nag --target demo-out/demo_app.exe -y
          python -m surreal revert demo-out/demo_app.exe
      - name: Real-binary smoke harness (on the demo PE)
        run: python tools/smoke_real_binary.py demo-out/demo_app.exe
      - name: Performance budget
        run: python tools/bench.py --mb 32

  lint:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile every module (syntax + import graph)
        run: python -m compileall -q surreal && python -c "import surreal.cli, surreal.testkit"
      - name: No network imports in the tool (it must run offline)
        run: |
          if grep -rnE "^\s*(import|from)\s+(socket|urllib|http|ftplib|requests|ssl)" surreal/; then
            echo "::error::surreal must not use the network"; exit 1
          fi
      - name: No private keys committed
        run: |
          if git ls-files | grep -E "(^|/)([^/]*\.key|[^/]*\.private)$"; then
            echo "::error::private keys must never be committed"; exit 1
          fi
      - name: No shell execution in the tool
        run: |
          if grep -rnE "(subprocess|os\.system|popen|eval\(|exec\()" surreal/; then
            echo "::error::surreal must not execute anything"; exit 1
          fi

  windows-exe:
    name: build surreal.exe
    needs: [test, lint]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --clean --noconfirm build/surreal.spec
      - name: Smoke test the frozen binary
        shell: pwsh
        run: |
          ./dist/surreal.exe --version
          ./dist/surreal.exe selftest
          ./dist/surreal.exe demo --out frozen-demo
          ./dist/surreal.exe check frozen-demo/demo-shorten-nag.morph --target frozen-demo/demo_app.exe
          ./dist/surreal.exe keys --generate frozen-demo/frozen.key --label frozen
          ./dist/surreal.exe sign frozen-demo/demo-shorten-nag.morph --key frozen-demo/frozen.key
          ./dist/surreal.exe verify frozen-demo/demo-shorten-nag.morph
          $size = "{0:N1} MB" -f ((Get-Item ./dist/surreal.exe).Length / 1MB)
          "size: $size" | Tee-Object -FilePath size.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: surreal-windows-x64
          path: |
            dist/surreal.exe
            size.txt
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/surreal.exe
          generate_release_notes: true
